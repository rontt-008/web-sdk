<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Lazy Evening</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		%sveltekit.head%
		<!-- the page never scrolls: the game fills the window exactly -->
		<style>
			html {
				overflow: hidden;
				height: 100%;
				overscroll-behavior: none;
			}
			canvas {
				display: block;
			}
		</style>
	</head>
	<body
		style="margin: 0; padding: 0; overflow: hidden; height: 100%; touch-action: manipulation; background-color: black"
	>
		<div>%sveltekit.body%</div>
	</body>
</html>
